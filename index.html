<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { createJalousieWall } from './jalousie.js?v=curtains-3';
import { createDomesticProps, animateDomesticProps, createFurnitureVariants, FURNITURE_FINISHES } from './domestic-props.js?v=domestic-7';
import { WALL_HANGINGS } from './wall-assets.js?v=photos-2';
import { RAW_OBJECTS, createRawObject } from './raw-object-assets.js?v=raw-2';
import { loadCurtainPatterns } from './photo-assets.js';
import { ROOM_WIDTHS, partitionPieces } from './room-widths.js';

import { LAYOUT_IDS, generateFurnitureLayout, checkFurnitureLayout } from './furniture-layouts.js?v=integrated-1';
import { FLOOR_IDS, createFloorVariant } from './floor-variants.js?v=integrated-1';
import { DOOR_STYLES, createDoorLeaves } from './doors.js?v=doors-2';
import { MODEL_ASSETS, loadModelAssets } from './model-assets.js';
import { createRoomSet, createRoomFixture } from './room-sets.js?v=sets-8';
import { createUratexSofa } from './uratex-sofa.js';
import { createWireRun } from './wire-runs.js';
import { createWallUtilities } from './wall-utilities.js?v=walls-2';
import {createWalkSequence,retainedRooms,walkRegions,canOccupy,moveWalker,pathToRoute} from './navigation.js';
import {addDomesticDetails} from './domestic-details.js?v=details-2';
let wallUtilities;
import { roomLighting } from './room-lighting.js';
import { spatialFrame, spatialPoint, SPATIAL_GLSL, SPATIAL_PROFILES } from './spatial-route.js';
import { floorHeight, cameraRoute, routePoint } from './room-sequences.js?v=room-lengths-3';
import { branchOpenings, raiseFloor, createRoomArchitecture } from './room-architecture.js?v=architecture-1';

// ---- palette (DepEd MPSS, stylized: green walls) ----
const COL = {
  wall:    0xBFDCC9,  // Foam Green
  trim:    0x4E7C63,  // Palmyra Green
  beige:   0xE7E0CC,  // Beige lightest
  floor:   0x9C9C95,  // non-skid gray
  ceiling: 0xF1F1EC,  // white
};

// ---- renderer: half-res for crunchy lo-fi upscale ----
// let three own its canvas (a pre-existing canvas can already hold a
// foreign context, which breaks texture upload) then insert it
const renderer = new THREE.WebGLRenderer({ antialias:false });
const canvas = renderer.domElement;
canvas.setAttribute('role','img');canvas.setAttribute('aria-label','A walkthrough of twisting domestic rooms. Use WASD to walk, mouse to look, and Space for automatic movement.');canvas.setAttribute('aria-describedby','movement-help');
canvas.id = 'c';
document.body.insertBefore(canvas, document.body.firstChild);
const RES = 0.5;                        // internal render scale
function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(1);
  renderer.setSize(w, h, false);
  renderer.domElement.width  = Math.floor(w*RES);
  renderer.domElement.height = Math.floor(h*RES);
  renderer.setViewport(0,0, w*RES, h*RES);
  cam.aspect = w/h; cam.updateProjectionMatrix();
}

const scene = new THREE.Scene();
scene.background = new THREE.Color(COL.wall);
// fog near wall color: hides ends, adds dread, free depth
scene.fog = new THREE.Fog(COL.wall, 4, 26);

const cam = new THREE.PerspectiveCamera(70, 1, 0.1, 180);
cam.position.set(0, 1.6, 0);           // eye height ~1.6m

// flat lighting — screensaver had none; one soft ambient + faint dir
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const roomLights=Array.from({length:3},()=>{const light=new THREE.PointLight(0xffe4b5,0,13,2);scene.add(light);return light;});
const dir = new THREE.DirectionalLight(0xffffff, 0.35);
dir.position.set(1, 2, 0.5); scene.add(dir);

// ---- world curvature: bend all geometry in view space to break the grid ----
// Counter-poetics: the corridor stays a straight, quantized grid; perception
// refuses it. Bend by distance² in view space -> floor/horizon curves (uCurve.y),
// straight hall appears to snake sideways (uCurve.x). Animated aperiodically in tick.
const CURVE = { amount: new THREE.Vector2(0.0, 0.006) };
const lightingBands=Array.from({length:6},()=>new THREE.Vector4(0,0,1,1));
const lightingModes=Array.from({length:6},()=>new THREE.Vector4(0,6,-1,0));
const lightingTints=Array.from({length:6},()=>new THREE.Color(0xffffff));
const spatialParams=new URLSearchParams(location.search);
const routeProfile=SPATIAL_PROFILES.includes(spatialParams.get('route'))?spatialParams.get('route'):'mixed';
const twisted=spatialParams.get('space')==='twist'||(spatialParams.get('space')!=='straight'&&!spatialParams.has('sequence'));
function curvize(material){
  material.onBeforeCompile = (shader)=>{
    shader.uniforms.uLightingBands={value:lightingBands};shader.uniforms.uLightingModes={value:lightingModes};shader.uniforms.uLightingTints={value:lightingTints};
    shader.vertexShader='varying vec2 vRoomCoord;\n'+shader.vertexShader;
    shader.vertexShader=shader.vertexShader.replace('#include <project_vertex>','vRoomCoord=(modelMatrix*vec4(transformed,1.0)).xz;\n#include <project_vertex>');
    shader.fragmentShader='varying vec2 vRoomCoord;\nuniform vec4 uLightingBands[6];\nuniform vec4 uLightingModes[6];\nuniform vec3 uLightingTints[6];\n'+shader.fragmentShader;
    shader.fragmentShader=shader.fragmentShader.replace('#include <opaque_fragment>',`
      for(int band=0;band<6;band++){
        vec4 b=uLightingBands[band],m=uLightingModes[band];
        // Interpolated wall coordinates can straddle an exact room boundary.
        // Give the earlier room a small overlap so a partition uses one profile.
        if(b.y>0.0&&vRoomCoord.y<=b.x+0.002&&vRoomCoord.y>=b.x-b.y-0.002){
          float windowDistance=vRoomCoord.x-m.z*(m.y*0.5-0.15);
          float windowPatch=exp(-windowDistance*windowDistance/3.5)*(0.35+0.65*pow(0.5+0.5*cos(vRoomCoord.y*1.3),4.0));
          outgoingLight *= (b.z+m.x*windowPatch)*uLightingTints[band];
          break;
        }
      }
      #include <opaque_fragment>`);
    if(twisted){
      shader.vertexShader=`#define SPATIAL_MODE ${SPATIAL_PROFILES.indexOf(routeProfile)}\n`+SPATIAL_GLSL+'\n'+shader.vertexShader;
      shader.vertexShader=shader.vertexShader.replace('#include <project_vertex>',`#include <project_vertex>
        vec3 routeWorld=(modelMatrix*vec4(transformed,1.0)).xyz;
        mvPosition=viewMatrix*vec4(spatialPoint(routeWorld),1.0);
        gl_Position=projectionMatrix*mvPosition;`);
      shader.vertexShader=shader.vertexShader.replace('#include <defaultnormal_vertex>',`#include <defaultnormal_vertex>
        transformedNormal=mat3(viewMatrix)*spatialBasis(-(modelMatrix*vec4(position,1.0)).z)*mat3(modelMatrix)*objectNormal;`);
      return;
    }
    shader.uniforms.uCurve = { value: CURVE.amount };   // shared ref; mutated per frame
    shader.vertexShader = 'uniform vec2 uCurve;\n' + shader.vertexShader;
    shader.vertexShader = shader.vertexShader.replace(
      '#include <project_vertex>',
      `#include <project_vertex>
        mvPosition.y += uCurve.y * mvPosition.z * mvPosition.z;
        mvPosition.x += uCurve.x * mvPosition.z * mvPosition.z;
        gl_Position = projectionMatrix * mvPosition;`
    );
  };
  return material;
}

// ---- constants ----
const TSCALE = 2.0;      // Kenney tile 1u -> 2m
const H = 1.29 * TSCALE; // wall-tile height => ~2.58m ceiling
const plane = (w,h) => new THREE.PlaneGeometry(w,h);
const params=new URLSearchParams(location.search);
const previewWidths=(params.get('widths')??params.get('width')??'').split(',').map(Number).filter(w=>ROOM_WIDTHS.includes(w));
const previewLengths=(params.get('lengths')??'').split(',').map(Number).filter(n=>Number.isInteger(n)&&n>=6&&n<=48&&n%2===0);
const demoSeed=Number.isInteger(Number(params.get('seed')))&&params.has('seed')?Number(params.get('seed')):5;
const sequence=createWalkSequence({sequence:params.get('sequence')||'demo',seed:demoSeed,widths:previewWidths,lengths:previewLengths,type:['sala','kitchen','bedroom','bathroom','bare','hall','auditorium'].includes(params.get('room'))?params.get('room'):undefined});
const roomWidth=i=>sequence.room(i).width;
const previewStart=Number(params.get('start'));
if(Number.isInteger(previewStart)){const room=sequence.room(previewStart),offset=Number(params.get('offset'));cam.position.z=room.startZ-Math.max(0.5,Math.min(room.length-0.5,offset||0.5));}
const roomHalf=group=>group.userData.width/2;
const texLoader = new THREE.TextureLoader();
const curtainPatterns=loadCurtainPatterns();
const patternedWindows=new Map();
const curtainStyles={windowCafe:{style:'cafe',color:0xd8e0c5},windowCream:{style:'gathered',color:0xe6dbbf},windowRose:{style:'gathered',color:0xc79691}};
function curtainWindow(name,r){
  const opening=Math.floor(r()*5);
  if(r()<0.55||!curtainPatterns.length)return WALLP[name][opening];
  const pattern=Math.floor(r()*curtainPatterns.length),key=`${name}:${opening}:${pattern}`;
  if(!patternedWindows.has(key))patternedWindows.set(key,createJalousieWall({height:H,wallColor:COL.wall,trimColor:COL.trim,curvize,
    curtains:{...curtainStyles[name],openness:opening/4,map:curtainPatterns[pattern]}}));
  return patternedWindows.get(key);
}

const linoleumTex = texLoader.load(encodeURI('models/textures/floor_linoleum_red.png'));
linoleumTex.wrapS = THREE.RepeatWrapping;
linoleumTex.wrapT = THREE.RepeatWrapping;
linoleumTex.repeat.set(1, 1);
linoleumTex.magFilter = THREE.NearestFilter;
linoleumTex.minFilter = THREE.NearestFilter;
linoleumTex.colorSpace = THREE.SRGBColorSpace;

const DOORS=createDoorLeaves(curvize);
const mat = {
  ceiling:       curvize(new THREE.MeshLambertMaterial({ color: COL.ceiling })),
};

// ---- loaders + caches (load each asset once, clone per placement) ----
const gltfLoader = new GLTFLoader();
const MODELS = 'models/GLTF format/';
function loadGLB(n){ return new Promise((res,rej)=>
  gltfLoader.load(encodeURI(MODELS + n + '.glb'), g=>res(g.scene), undefined, rej)); }
const WALLP = {};        // scaled+tinted wall-tile prototypes
const FURNI = {};        // raw furniture prototypes (scaled per clone)
const SPRMAT = {};       // sprite materials by filename
const ASP = { sofa: 162/273, curtain: 808/810, plant: 370/335,
              monobloc: 419/234, bamboo: 253/224,
              kutsaraTinidor: 894/422, standFan: 962/508,
              wallCalendar: 797/510, taboTimba: 754/689,
              waterDispenser: 944/348 };
function spriteMat(file){
  if (SPRMAT[file]) return SPRMAT[file];
  const tx = texLoader.load(encodeURI(file.startsWith('2d/')?file:'models/' + file));
  tx.magFilter = THREE.NearestFilter; tx.minFilter = THREE.NearestFilter;
  tx.colorSpace = THREE.SRGBColorSpace;
  return SPRMAT[file] = curvize(new THREE.MeshBasicMaterial({
    map: tx, alphaTest: 0.5, side: THREE.DoubleSide, fog: true }));
}
function prepWall(proto){                   // scale, foam-green tint, crunch
  proto.scale.setScalar(TSCALE);
  proto.traverse(o=>{ if (o.isMesh){
    o.material = curvize(o.material.clone());
    o.material.color = new THREE.Color(COL.wall);
    const mp = o.material.map;
    if (mp){ mp.magFilter = THREE.NearestFilter; mp.minFilter = THREE.NearestFilter; }
  }});
}
function prepFurni(proto){                   // curvize + crunch (clones share these)
  proto.traverse(o=>{ if (o.isMesh && o.material){
    curvize(o.material);
    if (o.material.map){ o.material.map.magFilter = THREE.NearestFilter;
      o.material.map.minFilter = THREE.NearestFilter; } }});
}

// ---- placement helpers (add into a segment group, local coords) ----
function addWall(group, proto, x, z, ry){
  const c = proto.clone(); c.position.set(x,0,z); c.rotation.y = ry; group.add(c);
}
function placeModel(group, name, { x=0, z=0, ry=0, targetH=null, scale=null, mode='floor', spin=false }){
  const obj = FURNI[name].clone();
  obj.rotation.y = ry;
  let box = new THREE.Box3().setFromObject(obj); const dim = new THREE.Vector3(); box.getSize(dim);
  if (scale) obj.scale.setScalar(scale); else if (targetH) obj.scale.setScalar(targetH/dim.y);
  box = new THREE.Box3().setFromObject(obj);
  obj.position.set(x, mode==='ceiling' ? group.userData.height-box.max.y : -box.min.y+floorHeight(group.userData,z), z);
  if (spin) obj.userData.spin = true;
  obj.userData.floorProp=mode==='floor';obj.userData.modelName=name;group.add(obj);
}
function addWallSprite(group, file, asp, w, side, z, baseY=0){
  const h = w*asp; const mesh = new THREE.Mesh(plane(w,h), spriteMat(file));
  mesh.userData.own = true; mesh.userData.floorProp=baseY===0; // floor-level wall sprites occupy space too
  mesh.position.set(side*(roomHalf(group)-0.12), baseY+h/2+floorHeight(group.userData,z), z);
  mesh.rotation.y = side>0 ? -Math.PI/2 : Math.PI/2;
  group.add(mesh);
}
function addBillboard(group, file, asp, w, x, z){
  const h = w*asp; const mesh = new THREE.Mesh(plane(w,h), spriteMat(file));
  mesh.userData.own = true; mesh.userData.billboard = true;
  mesh.position.set(x,h/2+floorHeight(group.userData,z),z); group.add(mesh);
}

// ---- procedural rooms: placers pick a seeded spot, rooms pick from a pool ----
const zin = (g,r) => g.userData.rise?-g.userData.length*(0.32+r()*0.36):-(1.5+r()*(g.userData.length-3));  // keep furniture off the partitions
const propZ=(g,r)=>g.userData.diningRoom&&!g.userData.rise?-g.userData.length*[0.09,0.5,0.91][Math.floor(r()*3)]+(r()-0.5)*0.25:zin(g,r);
const wallModel = (name,tH) => (g,r)=>{ const s = r()<0.5?-1:1;
  placeModel(g,name,{ x:s*(roomHalf(g)-0.45), z:propZ(g,r), ry:s>0?-Math.PI/2:Math.PI/2, targetH:tH });
  if(MODEL_ASSETS[name]||name.startsWith('uratex')){
    const obj=g.children.at(-1),box=new THREE.Box3().setFromObject(obj);
    obj.position.x+=s>0?roomHalf(g)-0.12-box.max.x:-roomHalf(g)+0.12-box.min.x;
  }
};
const floorModel = (name,tH) => (g,r)=>{ const s = r()<0.5?-1:1;
  placeModel(g,name,{ x:s*(0.8+r()*(roomHalf(g)-1.4)), z:propZ(g,r), ry:r()*6.28, targetH:tH }); };
const rawFloor = id => (g,r)=>{
  const asset=RAW_OBJECTS.find(p=>p.id===id),obj=createRawObject({THREE,asset,material:spriteMat(asset.file)});
  const side=r()<0.5?-1:1,z=params.get('prop')===id?-g.userData.length*0.55:zin(g,r);
  obj.position.x=side*(roomHalf(g)-0.4);obj.position.z=z;obj.position.y+=floorHeight(g.userData,z);g.add(obj);
};
const wallSpr = (file,asp,w,baseY=0) => (g,r)=>{ const s = r()<0.5?-1:1;
  addWallSprite(g,file,asp,w,s,propZ(g,r),baseY); };
const billb = (file,asp,w) => (g,r)=>{ const s = r()<0.5?-1:1;
  addBillboard(g,file,asp,w,s*(0.7+r()*(roomHalf(g)-1.4)),propZ(g,r)); };
const domesticWallFan = (g,r)=>{
  const s=r()<0.5?-1:1, obj=FURNI.wallFan.clone();
  const z=zin(g,r);obj.position.set(s*(roomHalf(g)-0.19),1.72+floorHeight(g.userData,z),z);
  obj.rotation.y=s>0?-Math.PI/2:Math.PI/2; g.add(obj);
};
const FURNITURE_VARIANTS={};
const chooseFinish=r=>Math.floor(r()*FURNITURE_FINISHES.length);
// Place utility objects only when their actual rotated bounds fit a free wall slot.
function utilityProp(group,name,r){
  const obj=FURNI[name].clone();
  obj.rotation.y=(r()-0.5)*0.5;
  if(name.startsWith('walis'))obj.rotation.z=(r()<0.5?-1:1)*0.10;
  const local=new THREE.Box3().setFromObject(obj);
  obj.position.y=-local.min.y;
  group.updateMatrixWorld(true);
  const obstacles=group.children.filter(o=>o.userData.diningTable||o.userData.diningChair||o.userData.floorProp||o.userData.billboard||o.userData.utilityProp||o.userData.door)
    .map(o=>new THREE.Box3().setFromObject(o).expandByScalar(0.05));
  const side=r()<0.5?-1:1;
  const fractions=group.userData.rise?[0.35,0.5,0.65,0.40,0.60]:[0.10,0.50,0.90,0.16,0.84,0.40,0.60];
  const offset=Math.floor(r()*fractions.length);
  for(let n=0;n<fractions.length*2;n++){
    const sign=n%2?side:-side;
    obj.position.x=sign>0?roomHalf(group)-0.12-local.max.x:-roomHalf(group)+0.12-local.min.x;
    obj.position.z=-group.userData.length*fractions[(Math.floor(n/2)+offset)%fractions.length];
    obj.position.y=-local.min.y+floorHeight(group.userData,obj.position.z);
    group.add(obj);obj.updateMatrixWorld(true);
    const box=new THREE.Box3().setFromObject(obj);
    const inside=box.min.z>=group.position.z-group.userData.length+0.15&&box.max.z<=group.position.z-0.15;
    if(inside&&(box.min.x>0.6||box.max.x< -0.6)&&!architectureCollision(group,box)&&!obstacles.some(other=>box.intersectsBox(other))){
      obj.userData.utilityProp=name;return true;
    }
    group.remove(obj);
  }
  // Do not force a prop through an occupied slot in a crowded room.
  return false;
}
function furnishUtilities(group,room,r){
  let names=[];
  if(params.get('utilities')==='all')names=['bucket','bucketPink','gasul','plasticDrawers','walisTambo','walisTingting'];
  else if(room==='kitchen')names=['gasul',r()<0.5?'bucket':'bucketPink',r()<0.5?'walisTambo':'walisTingting'];
  else if(room==='bedroom')names=['plasticDrawers',...(r()<0.5?['walisTambo']:[])];
  else if(room==='bathroom')names=[r()<0.5?'bucket':'bucketPink'];
  else if(room==='bare')names=[r()<0.5?'bucket':'bucketPink','walisTingting'];
  else names=[r()<0.5?'plasticDrawers':'walisTambo'];
  group.userData.omittedUtilities=names.filter(name=>!utilityProp(group,name,r));
}
const ROOMS = [
  {name:'bathroom',pool:[floorModel('bucket',0.3),floorModel('bucketPink',0.3)]},
  { name:'sala', pool:[
      rawFloor('rawDrawers'),rawFloor('rawCooler'),
      domesticWallFan, floorModel('deskFan',0.59),
      wallModel('phBookshelf',1.65),floorModel('phChair',0.88),floorModel('phCrate',0.32),wallModel('phDaybed',0.85),wallModel('bookcaseOpenLow',0.85),wallModel('sideTableDrawers',0.65),wallModel('loungeSofa',0.75), wallModel('televisionVintage',0.55),
      floorModel('pottedPlant',0.9), billb('plant.png',ASP.plant,0.9),
      wallModel('uratexNavy',0.62),wallModel('uratexFloral',0.62),wallModel('uratexMaroon',0.62),
      billb('stand_fan.png',ASP.standFan,0.65), wallSpr('wall_calendar.png',ASP.wallCalendar,0.35,1.2),
      billb('water_dispenser.png',ASP.waterDispenser,0.38) ] },
  { name:'kitchen', pool:[
      rawFloor('rawDrawers'),rawFloor('rawCooler'),
      domesticWallFan,
      wallModel('phRack',1.7),floorModel('phCrate2',0.32),floorModel('phCrate',0.32),floorModel('phChair',0.88),wallModel('kitchenFridge',1.7), wallModel('kitchenStove',0.9),
      floorModel('radio',0.28),
      billb('bamboochair.png',ASP.bamboo,0.6),
      wallSpr('kutsarat_tinidor.png',ASP.kutsaraTinidor,0.45,1.1),
      billb('tabo_timba.png',ASP.taboTimba,0.38),
      billb('water_dispenser.png',ASP.waterDispenser,0.38),
      billb('stand_fan.png',ASP.standFan,0.65) ] },
  { name:'bedroom', pool:[
      rawFloor('rawDrawers'),
      domesticWallFan, floorModel('deskFan',0.59),
      wallModel('phDaybed',0.85),floorModel('phPillows',0.25),wallModel('phBookshelf',1.65),wallModel('sideTableDrawers',0.65),wallModel('bedSingle',0.5), floorModel('pottedPlant',0.9),
      billb('bamboochair.png',ASP.bamboo,0.6),
      billb('stand_fan.png',ASP.standFan,0.65), wallSpr('wall_calendar.png',ASP.wallCalendar,0.35,1.2) ] },
  { name:'bare', pool:[rawFloor('rawDrawers'),rawFloor('rawCooler'),wallModel('phRack',1.7),floorModel('phCrate2',0.32),floorModel('phCrate',0.32),floorModel('phChair',0.88),
      billb('plant.png',ASP.plant,0.9), floorModel('pottedPlant',0.9),
      billb('stand_fan.png',ASP.standFan,0.65),

let dragging=false,lastMouse=null;
renderer.domElement.addEventListener('mousedown',event=>{if(event.button!==0)return;takeControl();dragging=true;lastMouse=[event.clientX,event.clientY];});
window.addEventListener('mouseup',()=>{dragging=false;lastMouse=null;});
renderer.domElement.addEventListener('click',async()=>{try{await renderer.domElement.requestPointerLock?.();}catch{ /* Drag-to-look remains available. */ }});
document.addEventListener('mousemove',event=>{
  if(!manual)return;
  const locked=document.pointerLockElement===renderer.domElement;
  if(!locked&&!dragging)return;
  const dx=locked?event.movementX:event.clientX-(lastMouse?.[0]??event.clientX),dy=locked?event.movementY:event.clientY-(lastMouse?.[1]??event.clientY);
  lastMouse=[event.clientX,event.clientY];walker.yaw-=dx*0.0025;walker.pitch=Math.max(-1.25,Math.min(1.25,walker.pitch-dy*0.0025));
});
document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement){keys.clear();dragging=false;}});
const movementClock=new THREE.Clock();
const _wp = new THREE.Vector3();
function tick(){
  const elapsed=movementClock.getDelta(),delta=paused||document.hidden?0:Math.min(elapsed,0.05);
  t += delta;
  ensureSegments();
  const travel=advanceCamera(delta),current=travel.room;
  ensureSegments();
  cam.position.y=travel.floor+1.6+Math.sin(t*4)*0.03;
  const streamFront=Math.min(...[...segments.values()].map(g=>g.position.z-g.userData.length));
  const streamBack=Math.max(...[...segments.values()].map(g=>g.position.z));
  const available=manual||rejoin?Math.min(cam.position.z-streamFront,streamBack-cam.position.z):cam.position.z-streamFront;
  // Wide rooms need lateral depth even when the streamed longitudinal edge is near.
  const spacious=current.width>=40;
  const lateral=Math.abs(Math.sin(manual||rejoin?walker.yaw:travelYaw));
  const viewDepth=spacious?available+(Math.max(available,current.width*0.8)-available)*lateral:available;
  scene.fog.far=Math.min(spacious?100:current.height>=10?70:26,Math.max(8,viewDepth-0.4));
  if(!manual&&!rejoin)cam.position.x+=Math.sin(t*0.6)*0.12;
  const viewYaw=manual||rejoin?walker.yaw:travelYaw+Math.sin(t*0.3)*0.05,viewPitch=manual||rejoin?walker.pitch:0;
  cam.rotation.order='YXZ';cam.rotation.set(viewPitch,viewYaw,0);
  if(params.has('inspect')){
    const state=document.getElementById('route-state')??document.body.appendChild(Object.assign(document.createElement('pre'),{id:'route-state',hidden:true}));
    state.textContent=JSON.stringify({room:travelRoom,distance:travelDistance,length:travelRoute.length,x:cam.position.x,y:cam.position.y,z:cam.position.z,yaw:viewYaw,pitch:viewPitch,mode:manual?'manual':rejoin?'returning':'automatic',retained:[...segments.keys()],floor:travel.floor});
  }
  const PHI = 1.61803398875;                    // aperiodic warp (never loops)
  CURVE.amount.y = 0.006 + 0.0030*Math.sin(t*0.13);
  CURVE.amount.x = 0.0042*Math.sin(t*0.061) + 0.0018*Math.sin(t*0.061*PHI);
  cam.fov = twisted?72:72 + 7*Math.sin(t*0.09) + 3.5*Math.sin(t*0.09*PHI);
  cam.updateProjectionMatrix();
  cam.rotation.z = manual?0:0.02*Math.sin(t*0.047*PHI);
  for (const grp of segments.values()) grp.traverse(o=>{
    if (o.userData.billboard){ o.getWorldPosition(_wp);
      const parentYaw=o.userData.rawObject&&o.parent.userData.diningTable?o.parent.rotation.y:0;
      o.rotation.y = Math.atan2(cam.position.x-_wp.x, cam.position.z-_wp.z)-parentYaw; }
    else if (o.userData.spin){ o.rotation.y += delta*4.8; }
  });
    animateDomesticProps(scene,t);
  const logicalZ=cam.position.z;
    let band=0;
    for(const g of segments.values()){
      const l=g.userData.lighting;
      lightingBands[band].set(g.position.z,g.userData.length,l.base,0);
      lightingModes[band].set(l.window,g.userData.width,l.side,0);lightingTints[band].setHex(l.tint);band++;
    }
    for(;band<6;band++)lightingBands[band].y=0;
    const currentLighting=segments.get(travelRoom).userData.lighting;
    scene.fog.color.lerp(new THREE.Color(COL.wall).multiplyScalar(currentLighting.fog),Math.min(1,delta*2));scene.background.copy(scene.fog.color);
    for(let n=0;n<roomLights.length;n++){
      const g=segments.get(travelRoom+n-1),light=roomLights[n];
      if(!g){light.intensity=0;continue;}
      const fixture=g.userData.lightFixture,local=[0,fixture.userData.lightY,g.position.z+fixture.position.z];
      light.position.fromArray(twisted?spatialPoint(...local,routeProfile):local);
      light.color.setHex(fixture.userData.lightColor);
      light.intensity=g.userData.lighting.lamp*Math.exp(-Math.pow((logicalZ-local[2])/11,2));
    }
    if(twisted){
      const f=spatialFrame(-cam.position.z,routeProfile),world=spatialPoint(cam.position.x,cam.position.y,cam.position.z,routeProfile);
      cam.position.fromArray(world);
      cam.up.fromArray(f.up);
      const direction=new THREE.Vector3().fromArray(f.back).multiplyScalar(-Math.cos(viewYaw)*Math.cos(viewPitch))
        .addScaledVector(new THREE.Vector3().fromArray(f.right),-Math.sin(viewYaw)*Math.cos(viewPitch))
        .addScaledVector(new THREE.Vector3().fromArray(f.up),Math.sin(viewPitch));
      cam.lookAt(new THREE.Vector3().fromArray(world).add(direction));
      if(params.has('inspect')){
        const state=document.getElementById('route-state'),logical=JSON.parse(state.textContent);
        state.textContent=JSON.stringify({...logical,space:'twist',profile:routeProfile,roll:f.roll,world:world,up:f.up,fov:cam.fov});
      }
      for(const grp of segments.values())grp.traverse(o=>{if(o.isMesh)o.frustumCulled=false;});
    }
    renderer.render(scene, cam);
  requestAnimationFrame(tick);
}

function inspectRooms(){
    scene.updateMatrixWorld(true);
    const report=[];
    for(const [i,g] of segments){
      const partition=g.getObjectByName('room-partition'),maxHalf=Math.max(g.userData.width,roomWidth(i+1))/2;
      const ray=new THREE.Raycaster(),blocked=x=>{
        ray.set(new THREE.Vector3(x,1.6,g.position.z-g.userData.length+1),new THREE.Vector3(0,0,-1));
        return ray.intersectObject(partition,true).some(hit=>hit.distance<2);
      };
      const shoulders=[];for(let x=1.1;x<maxHalf;x+=0.2)shoulders.push(blocked(x),blocked(-x));
      const furniture=g.children.filter(o=>o.userData.diningTable||o.userData.diningChair);
      const clear=furniture.every(o=>{const box=new THREE.Box3().setFromObject(o);return box.min.x>0.6||box.max.x< -0.6;});
      const furnitureInside=furniture.every(o=>{const box=new THREE.Box3().setFromObject(o);return box.min.z>=g.position.z-g.userData.length&&box.max.z<=g.position.z&&box.min.x>=-g.userData.width/2&&box.max.x<=g.userData.width/2;});
      const utilities=g.children.filter(o=>o.userData.utilityProp);
      const utilityBoundsClear=utilities.every(o=>{const box=new THREE.Box3().setFromObject(o);return (box.min.x>0.6||box.max.x< -0.6)&&box.min.x>=-g.userData.width/2&&box.max.x<=g.userData.width/2&&box.min.z>=g.position.z-g.userData.length&&box.max.z<=g.position.z;});
      const utilityOverlapFree=utilities.every(o=>{const box=new THREE.Box3().setFromObject(o);return g.children.filter(other=>other!==o&&(other.userData.utilityProp||other.userData.diningTable||other.userData.diningChair||other.userData.floorProp||other.userData.billboard)).every(other=>!box.intersectsBox(new THREE.Box3().setFromObject(other)));});
      const boxes=furniture.map(o=>{const b=new THREE.Box3().setFromObject(o,true),y=floorHeight(g.userData,o.position.z);return {minX:b.min.x,maxX:b.max.x,minZ:b.min.z-g.position.z,maxZ:b.max.z-g.position.z,minY:b.min.y-y,maxY:b.max.y-y};});
      const layoutCheck=checkFurnitureLayout(furniture.map(o=>o.userData.placement),{width:g.userData.width,length:g.userData.length,boxes});
      const fb=new THREE.Box3().setFromObject(g.userData.floorGroup);
      const floorBoundsClear=Math.abs(fb.min.z-(g.position.z-g.userData.length))<0.005&&Math.abs(fb.max.z-g.position.z)<0.005&&Math.abs(fb.min.x+g.userData.width/2)<0.005&&Math.abs(fb.max.x-g.userData.width/2)<0.005;
      const surfaceSamples=[0.01,0.125,0.25,0.5,0.75,0.875,0.99].map(u=>{
        const z=-g.userData.length*u,y=floorHeight(g.userData,z);
        ray.set(new THREE.Vector3(0,y+0.4,g.position.z+z),new THREE.Vector3(0,-1,0));
        const hit=ray.intersectObject(g.userData.floorGroup,true)[0];
        return !!hit&&Math.abs(hit.point.y-y)<0.025;
      });
      const branchBlockers=[];
      const branchesOpen=g.userData.architecture.userData.openings.map(p=>{
        ray.set(new THREE.Vector3(0,floorHeight(g.userData,p.z)+1.6,g.position.z+p.z),new THREE.Vector3(p.side,0,0));
        const hits=ray.intersectObject(g,true).filter(hit=>hit.distance<g.userData.width/2+1);
        for(const hit of hits){let root=hit.object;while(root.parent&&root.parent!==g)root=root.parent;branchBlockers.push({side:p.side,distance:hit.distance,name:root.name,data:root.userData});}
        return !hits.length;
      }).every(Boolean);
      const photos=g.children.filter(o=>o.userData.wallPhoto).map(o=>new THREE.Box3().setFromObject(o).getSize(new THREE.Vector3()).toArray());
      const imported=[];g.traverse(o=>{if(o.userData.importedModel)imported.push(o.userData.importedModel);});
      report.push({i,imported,routeSurfaceClear:surfaceSamples.every(Boolean),branchesOpen,branchBlockers,type:g.userData.type,shape:g.userData.shape,height:g.userData.height,rise:g.userData.rise,branches:g.userData.architecture.userData.openings.length,architectureClear:[...furniture,...utilities].every(o=>!architectureCollision(g,new THREE.Box3().setFromObject(o))),cameraFloor:floorHeight(g.userData,cam.position.z-g.position.z),layoutCheck:layoutCheck.ok,layoutFailures:layoutCheck.failures,floorBoundsClear,photos,doors:g.children.filter(o=>o.userData.door).map(o=>o.userData.door),utilities:utilities.map(o=>o.userData.utilityProp),omittedUtilities:g.userData.omittedUtilities,utilityBoundsClear,utilityOverlapFree,furnitureInside,startZ:g.position.z,length:g.userData.length,phrase:g.userData.phrase,layout:g.userData.layout,floor:g.userData.floor,width:g.userData.width,nextWidth:roomWidth(i+1),doorClear:!blocked(0),shouldersClosed:shoulders.every(Boolean),aisleClear:clear,tables:furniture.filter(o=>o.userData.diningTable).length,chairs:furniture.filter(o=>o.userData.diningChair).length});
    }
    for(const item of report){
      const g=segments.get(item.i),sets=g.children.filter(o=>o.userData.roomSet);
      item.roomSets=sets.map(o=>o.userData.roomSet);
      item.roomSetsClear=sets.every(o=>{const b=new THREE.Box3().setFromObject(o);return b.min.x>=-g.userData.width/2+0.05&&b.max.x<=g.userData.width/2-0.05&&(b.max.x<=-0.6||b.min.x>=0.6)&&b.min.z>=g.position.z-g.userData.length+0.2&&b.max.z<=g.position.z-0.2&&g.children.filter(p=>p.userData.diningChair||p.userData.diningTable).every(p=>!b.intersectsBox(new THREE.Box3().setFromObject(p)));});
      item.fixtures=sets.flatMap(o=>o.children.map(p=>p.userData.fixture));
      item.sofas=[];g.traverse(o=>{if(o.name==='uratexSofa')item.sofas.push({fabric:o.userData.fabricStyle,pillows:o.userData.pillowConfig});});
      item.rawObjects=[];g.traverse(o=>{if(o.userData.rawObject)item.rawObjects.push(o.userData.rawObject);});
      item.photoFiles=g.children.filter(o=>o.userData.wallPhoto).map(o=>o.userData.photoFile);
      item.wireRuns=g.children.filter(o=>o.userData.wireRun).map(o=>({side:Math.sign(o.position.x),z:o.position.z,plan:o.userData.plan}));
      item.televisions=g.children.filter(o=>o.userData.wallTv).map(o=>({...o.userData.wallTv,x:o.position.x,z:o.position.z}));
      item.pipes=g.children.filter(o=>o.userData.pipeRun).map(o=>({...o.userData.pipeRun,z:o.position.z}));
      item.domesticDetails=g.userData.domesticDetails.userData.details;
      item.lightColor=g.userData.lightFixture.userData.lightColor;
      item.lightFixture=g.userData.lightFixture.userData.fixtureType;
      item.lighting=g.userData.lighting.name;
    }
    let output=document.getElementById('room-inspection');
    if(!output){output=document.createElement('pre');output.id='room-inspection';output.hidden=true;document.body.append(output);}
    output.textContent=JSON.stringify(report);
  }

  async function init(){
    wallUtilities=createWallUtilities({THREE,curvize});
    Object.assign(FURNI,createDomesticProps());
    // Static furniture shares merged geometry across finishes and streamed clones.
    for(const name of ['monoblocChair','monoblocTable','woodTable']){
      const proto=FURNI[name],batches=new Map();proto.updateMatrixWorld(true);
      proto.traverse(o=>{if(o.isMesh){
        const geo=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone();geo.applyMatrix4(o.matrixWorld);
        if(!batches.has(o.material))batches.set(o.material,[]);batches.get(o.material).push(geo);
      }});
      proto.clear();
      for(const [material,pieces] of batches){proto.add(new THREE.Mesh(mergeGeometries(pieces),material));pieces.forEach(g=>g.dispose());}
    }
    for(const proto of Object.values(FURNI)) prepFurni(proto);
    Object.assign(FURNITURE_VARIANTS,createFurnitureVariants(FURNI));
    for(const variants of Object.values(FURNITURE_VARIANTS))for(const proto of variants)prepFurni(proto);
  await Promise.all(['wall','wallDoorway','wallHalf']
    .map(async n => { const s = await loadGLB(n); prepWall(s); WALLP[n]=s; }));
  WALLP.wallWindow = createJalousieWall({ height: H, wallColor: COL.wall,
    trimColor: COL.trim, curvize });
  for(const [name,style,color] of [['windowCafe','cafe',0xd8e0c5],
      ['windowCream','gathered',0xe6dbbf],['windowRose','gathered',0xc79691]])
    WALLP[name]=[0,0.25,0.5,0.75,1].map(openness=>createJalousieWall({height:H,wallColor:COL.wall,trimColor:COL.trim,
      curvize,curtains:{style,color,openness}}));
  await Promise.all(['ceilingFan','loungeSofa','televisionVintage','pottedPlant',
    'kitchenFridge','kitchenStove','kitchenSink','bathroomSink','bathroomMirror','toilet','bedSingle','radio','laptop','books','lampRoundTable','kitchenBlender','bookcaseOpenLow','sideTableDrawers','kitchenCabinet','rugDoormat','rugRectangle']
    .map(async n => { const s = await loadGLB(n); prepFurni(s); FURNI[n]=s; }));
  await Promise.all([['normalWindow','wallWindow'],['slidingWindow','wallWindowSlide']]
    .map(async ([key,file])=>{const model=await loadGLB(file);prepWall(model);WALLP[key]=model;}));
  Object.assign(FURNI,await loadModelAssets(curvize));
  for(const [name,fabricStyle,pillowConfig] of [['uratexNavy','trellisNavy','singleCenter'],['uratexFloral','vintageFloral','domesticMix'],['uratexMaroon','solidMaroon','twoThrows']]){
    FURNI[name]=createUratexSofa({THREE,width:1.45,fabricStyle,pillowConfig,curvize});
  }
  resize();

  document.getElementById('status').hidden=true;
  tick();
}
window.addEventListener('resize', resize);
init().catch(error=>{console.error(error);document.getElementById('status').textContent='The demo could not load. Check your connection, then use Restart.';});
</script>
